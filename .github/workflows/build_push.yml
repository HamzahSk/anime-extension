name: Build Anichin Only

on:
  push:
    branches:
      - master
    paths:
      - 'src/eu/kanade/tachiyomi/animeextension/id/anichin/**'
      - 'build.gradle'
      - '.github/workflows/build_push.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Anichin Extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout ${{ github.ref_name }} branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > signingkey.jks
          chmod 600 signingkey.jks

      - name: Build Anichin APK
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Perintah ini akan langsung mem-build APK untuk modul Anichin
          ./gradlew :src:id:anichin:spotlessApply
          ./gradlew :src:id:anichin:assembleRelease

      - name: Upload Anichin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Anichin-APK"
          path: "**/*.apk"
          retention-days: 7

      - name: Clean up CI files
        if: always()
        run: rm -f signingkey.jks
