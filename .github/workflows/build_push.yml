name: CI Dynamic Anime Extension Build

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-and-build:
    name: Detect and Build Changed Anime Extensions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Memerlukan 2 commit terakhir untuk mendeteksi perbedaan (git diff)
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > signingkey.jks
          chmod 600 signingkey.jks

      - name: Detect Changes and Build
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Mengambil daftar berkas yang berubah pada commit terakhir
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          
          # 2. Mencari folder modul unik di bawah src/ (contoh: src/all/anikku)
          # Menggunakan 'awk' untuk mengambil path dasar modul saja
          CHANGED_MODULES=$(echo "$CHANGED_FILES" | grep '^src/' | awk -F/ '{print ":"$1":"$2":"$3}' | sort -u)
          
          if [ -z "$CHANGED_MODULES" ]; then
            echo "Tidak ada perubahan kode di folder ekstensi (src/)."
            exit 0
          fi
          
          # 3. Menjalankan build Release untuk setiap modul yang terdeteksi
          echo "Modul anime yang terdeteksi berubah:"
          echo "$CHANGED_MODULES"
          echo "----------------------------------------"
          
          for MODULE in $CHANGED_MODULES; do
            echo "Memulai build untuk modul: $MODULE"
            # Menjalankan spotlessApply dan assembleRelease seperti di versi tunggal
            ./gradlew ${MODULE}:spotlessApply
            ./gradlew ${MODULE}:assembleRelease
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "changed-anime-extensions-apks"
          # Mengambil APK dari folder release
          path: "**/build/outputs/apk/release/*.apk" 
          retention-days: 7

      - name: Clean up CI files
        if: always()
        run: rm -f signingkey.jks
